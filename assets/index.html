<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>revelio.nvim</title>
    {{CLIENT_HEAD}}
    <!-- app.css loads last so its .markdown-body sizing (max-width/margin:
         auto/padding) overrides github-markdown-css's own base reset, which
         sets margin: 0 on .markdown-body — loading app.css first left
         content flush-left with a big blank gutter instead of centered. -->
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="placeholder">revelio: waiting for content&hellip;</div>
    <div id="content" class="markdown-body"></div>
    <script id="revelio-payload" type="application/json">{{INITIAL_PAYLOAD}}</script>
    {{CLIENT_SCRIPTS}}
    <script src="/app.js"></script>
  </body>
</html>
